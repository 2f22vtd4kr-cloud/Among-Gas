name: Among Gas build and gameplay smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PORT: 5173
      BASE_PATH: /
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Keep CI aligned with .replit's nodejs-20 runtime.
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Assert CI runtime matches Replit
        run: node -e "if (process.versions.node.split('.')[0] !== '20') throw new Error('CI must match Replit Node.js 20 runtime')"

      - name: Verify Replit post-merge hook skips an empty database schema
        run: env -u DATABASE_URL bash scripts/post-merge.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify world-to-image source rectangles for canonical PNG and high-resolution WebP
        run: pnpm --filter @workspace/scripts run test:map-image-transform

      - name: Verify character atlas crops, authored scale and shared feet anchor
        run: pnpm --filter @workspace/scripts run test:character-geometry

      - name: Exhaustively verify real-map player footprint and reachable geometry
        run: node scripts/verify-map-mechanics.mjs

      - name: Generate a non-production collision-analysis preview from the red-line reference
        run: |
          before=$(sha256sum lib/shared/src/collisionData.ts)
          pnpm --filter @workspace/scripts exec tsx src/analyzeCollisionMap.ts
          after=$(sha256sum lib/shared/src/collisionData.ts)
          test "$before" = "$after" || { echo "Collision analyzer modified production collisionData.ts"; exit 1; }

      - name: Verify base-game vision and wall occlusion
        run: pnpm --filter @workspace/api-server exec tsx ../../scripts/test-visibility.ts

      - name: Verify client/server movement collision agreement, thin walls, corners and bounds
        run: pnpm --filter @workspace/api-server exec tsx ../../scripts/test-player-movement.ts

      - name: Typecheck and build API/frontend
        run: pnpm run build

      - name: Verify Replit single-origin production serving
        run: |
          set -euo pipefail
          PORT=8080 NODE_ENV=production TELEGRAM_BOT_TOKEN=ci-placeholder-not-a-real-token node --enable-source-maps artifacts/api-server/dist/index.mjs >/tmp/among-gas-production.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat /tmp/among-gas-production.log; exit 1; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8080/" | grep -q '<div id="root">'
          curl -fsS "http://127.0.0.1:8080/game" | grep -q '<div id="root">'
          curl -fsS "http://127.0.0.1:8080/sprites/characters.png" -o /dev/null
          curl -fsS "http://127.0.0.1:8080/api/healthz" | grep -q '"status":"ok"'

      - name: Verify Replit development preview and WebSocket proxy
        run: |
          set -euo pipefail
          VITE_ENABLE_GAME_MOCKS=true VITE_WS_URL=wss://invalid.example/api/ws bash scripts/replit-dev.sh >/tmp/among-gas-replit-dev.log 2>&1 &
          stack_pid=$!
          cleanup() {
            trap - EXIT
            kill -TERM "$stack_pid" 2>/dev/null || true
            wait "$stack_pid" 2>/dev/null || true
            for port in 5173 8080; do
              for attempt in $(seq 1 10); do
                alive=0
                if [ "$port" = "5173" ]; then
                  curl -fsS "http://127.0.0.1:5173/" >/dev/null 2>&1 && alive=1 || true
                else
                  curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null 2>&1 && alive=1 || true
                fi
                if [ "$alive" -eq 0 ]; then break; fi
                sleep 1
              done
              if [ "$alive" -ne 0 ]; then echo "Replit process tree left port $port running after shutdown" >&2; exit 1; fi
            done
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5173/api/healthz" >/dev/null; then ready=1; break; fi
            if ! kill -0 "$stack_pid" 2>/dev/null; then cat /tmp/among-gas-replit-dev.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/among-gas-replit-dev.log; exit 1; fi
          curl -fsS "http://127.0.0.1:5173/" | grep -q '<div id="root">'
          WS_URL=ws://127.0.0.1:5173/api/ws node test_sabotage.mjs
      - name: Archive production Telegram Mini App build for deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: telegram-game-static-build
          path: artifacts/telegram-game/dist/public/
          if-no-files-found: error
          retention-days: 3

      - name: Run server gameplay invariants
        run: pnpm --filter @workspace/api-server run test:gameplay

      - name: Verify production Telegram HMAC authentication
        run: pnpm --filter @workspace/api-server exec tsx src/test_auth.ts

      - name: Verify live WebSocket lobby, role assignment, and sabotage authorization
        run: |
          set -euo pipefail
          PORT=8080 NODE_ENV=development node --enable-source-maps artifacts/api-server/dist/index.mjs >/tmp/among-gas-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat /tmp/among-gas-api.log; exit 1; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null || {
            cat /tmp/among-gas-api.log
            exit 1
          }
          node test_sabotage.mjs

      - name: Prepare Playwright for mobile and desktop browser smoke tests
        run: npm install --prefix /tmp/among-gas-playwright --no-save playwright@1.56.1

      - name: Start Telegram Mini App and play a mobile UI smoke test
        env:
          PLAYWRIGHT_MODULE: /tmp/among-gas-playwright/node_modules/playwright/index.mjs
          VISUAL_QA_DIR: ${{ runner.temp }}/among-gas-visual-qa
        run: |
          nohup env VITE_ENABLE_GAME_MOCKS=true pnpm --filter @workspace/telegram-game run dev >/tmp/among-gas-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5173/?mock=task-interaction" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:5173/?mock=task-interaction" >/dev/null
          node scripts/browser-smoke.mjs
          node scripts/test-audio-preload.mjs
          node scripts/test-character-atlas-browser.mjs

      - name: Render production-map collision overlay for visual QA
        run: pnpm --filter @workspace/scripts exec tsx src/renderCollisionQa.ts

      - name: Upload gameplay visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: among-gas-visual-qa
          path: |
            ${{ runner.temp }}/among-gas-visual-qa/*.png
            artifacts/telegram-game/collision-qa-overlay.png
            artifacts/telegram-game/collision-reference-overlay.png
            attached_assets/IMG_2907_1783632830477.jpeg
            artifacts/telegram-game/collision-qa-overlay-webp.png
            lib/shared/src/collisionData.generated-preview.ts
          if-no-files-found: warn
          retention-days: 3

      - name: Run headless multiplayer gameplay simulations
        run: pnpm --filter @workspace/api-server run simulate -- --games 100 --bots 6 --concurrency 25 --timeoutMs 300000 --quiet --maxTimeouts 0
