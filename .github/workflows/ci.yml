name: Among Gas build and gameplay smoke tests

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

# Keep only the newest CI run per PR/branch; parallel agents push frequently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PORT: 5173
      BASE_PATH: /
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Keep CI aligned with .replit's patched nodejs-24 LTS runtime.
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Assert CI runtime matches Replit Node.js 24 LTS
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 22) throw new Error('CI requires Node.js 24.22.0+ LTS')"

      - name: Verify Replit post-merge hook skips an empty database schema
        run: env -u DATABASE_URL bash scripts/post-merge.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependency advisories
        run: pnpm audit --prod --audit-level low

      - name: Audit complete workspace dependency graph
        run: pnpm audit --audit-level low

      - name: Verify world-to-image source rectangles for canonical PNG and high-resolution WebP
        run: pnpm --filter @workspace/scripts run test:map-image-transform

      - name: Test extracted GameMap camera smoothing and viewport bounds
        run: pnpm --filter @workspace/scripts run test:map-camera

      - name: Verify remote-player interpolation and walk animation timing
        run: pnpm --filter @workspace/scripts run test:remote-player-animation

      - name: Test extracted GameMap task and sabotage marker rendering
        run: pnpm --filter @workspace/scripts run test:map-renderer

      - name: Test extracted contextual HUD action selection and disable rules
        run: pnpm --filter @workspace/scripts run test:game-action-state

      - name: Test shared keyboard and joystick movement input contracts
        run: pnpm --filter @workspace/scripts run test:game-input

      - name: Verify A* navigation rejects invalid map coordinates and preserves route safety
        run: pnpm --filter @workspace/scripts run test:pathfinding

      - name: Verify vector collision engine and mobile editor geometry helpers
        run: pnpm --filter @workspace/scripts run test:vector-collision

      - name: Verify character atlas crops, authored scale and shared feet anchor
        run: pnpm --filter @workspace/scripts run test:character-geometry

      - name: Exhaustively verify real-map player footprint and reachable geometry
        run: node scripts/verify-map-mechanics.mjs

      - name: Generate a non-production collision-analysis preview from the red-line reference
        run: |
          before=$(sha256sum lib/shared/src/collisionData.ts)
          pnpm --filter @workspace/scripts exec tsx src/analyzeCollisionMap.ts
          after=$(sha256sum lib/shared/src/collisionData.ts)
          test "$before" = "$after" || { echo "Collision analyzer modified production collisionData.ts"; exit 1; }

      - name: Generate and quality-check baseline and optional sharpened 2× map tiles
        run: pnpm --filter @workspace/scripts run build:map-tiles && pnpm --filter @workspace/scripts run test:map-tiles

      - name: Verify TiledMap renderer lifecycle, seam bleed and failure recovery
        run: pnpm --filter @workspace/scripts run test:map-renderer

      - name: Test offline context-aware map refinement and seam QA
        run: |
          python -m pip install -r scripts/map-tiles/requirements.txt
          python -m unittest discover -s scripts/map-tiles/tests -v

      - name: Generate vector analysis preview and verify it remains outside gameplay runtime
        run: pnpm --filter @workspace/scripts run test:production-world
      - name: Verify base-game vision and wall occlusion
        run: pnpm --filter @workspace/api-server exec tsx ../../scripts/test-visibility.ts

      - name: Verify client/server movement collision agreement, thin walls, corners and bounds
        run: pnpm --filter @workspace/api-server exec tsx ../../scripts/test-player-movement.ts

      - name: Typecheck and build API/frontend
        run: pnpm run build

      - name: Verify the eleven task minigames render through independent modules
        run: pnpm --filter @workspace/scripts run test:minigame-registry

      - name: Archive reproducible raster-derived vector seed for human review
        uses: actions/upload-artifact@v7
        with:
          name: vector-collision-seed-review
          path: |
            lib/shared/src/collision/collision.v1.json
            lib/shared/src/collision/generatedDocument.ts
          if-no-files-found: error
          retention-days: 7

      - name: Verify Replit single-origin production serving
        run: |
          set -euo pipefail
          PORT=8080 NODE_ENV=production TELEGRAM_BOT_TOKEN=ci-placeholder-not-a-real-token node --enable-source-maps artifacts/api-server/dist/index.mjs >/tmp/among-gas-production.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat /tmp/among-gas-production.log; exit 1; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8080/" | grep -q '<div id="root">'
          curl -fsS "http://127.0.0.1:8080/game" | grep -q '<div id="root">'
          curl -fsS "http://127.0.0.1:8080/sprites/characters.png" -o /dev/null
          curl -fsS "http://127.0.0.1:8080/api/healthz" | grep -q '"status":"ok"'

      - name: Verify Replit development preview and WebSocket proxy
        run: |
          set -euo pipefail
          VITE_ENABLE_GAME_MOCKS=true VITE_WS_URL=wss://invalid.example/api/ws bash scripts/replit-dev.sh >/tmp/among-gas-replit-dev.log 2>&1 &
          stack_pid=$!
          cleanup() {
            trap - EXIT
            kill -TERM "$stack_pid" 2>/dev/null || true
            wait "$stack_pid" 2>/dev/null || true
            for port in 5173 8080; do
              for attempt in $(seq 1 10); do
                alive=0
                if [ "$port" = "5173" ]; then
                  curl -fsS "http://127.0.0.1:5173/" >/dev/null 2>&1 && alive=1 || true
                else
                  curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null 2>&1 && alive=1 || true
                fi
                if [ "$alive" -eq 0 ]; then break; fi
                sleep 1
              done
              if [ "$alive" -ne 0 ]; then echo "Replit process tree left port $port running after shutdown" >&2; exit 1; fi
            done
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5173/api/healthz" >/dev/null; then ready=1; break; fi
            if ! kill -0 "$stack_pid" 2>/dev/null; then cat /tmp/among-gas-replit-dev.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/among-gas-replit-dev.log; exit 1; fi
          curl -fsS "http://127.0.0.1:5173/" | grep -q '<div id="root">'
          WS_URL=ws://127.0.0.1:5173/api/ws node test_sabotage.mjs
      - name: Archive production Telegram Mini App build for deployment verification
        uses: actions/upload-artifact@v7
        with:
          name: telegram-game-static-build
          path: artifacts/telegram-game/dist/public/
          if-no-files-found: error
          retention-days: 3

      - name: Run server gameplay invariants
        run: pnpm --filter @workspace/api-server run test:gameplay

      - name: Verify evidence-weighted bot votes use only public meeting information
        run: pnpm --filter @workspace/api-server exec tsx src/test_bot_voting.ts

      - name: Verify Telegram Mini App lobby invite start parameters
        run: pnpm --filter @workspace/scripts run test:telegram-start-param

      - name: Verify WebSocket reconnect grace, slot recovery and resume snapshot isolation
        run: pnpm --filter @workspace/api-server exec tsx src/test_reconnect.ts

      - name: Verify production Telegram HMAC authentication
        run: pnpm --filter @workspace/api-server exec tsx src/test_auth.ts

      - name: Verify live WebSocket lobby, role assignment, and sabotage authorization
        run: |
          set -euo pipefail
          PORT=8080 NODE_ENV=development node --enable-source-maps artifacts/api-server/dist/index.mjs >/tmp/among-gas-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat /tmp/among-gas-api.log; exit 1; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8080/api/healthz" >/dev/null || {
            cat /tmp/among-gas-api.log
            exit 1
          }
          node test_sabotage.mjs
          node test_report_body.mjs
          node test_reconnect_ws.mjs
          node test_solo_bot_discussion.mjs

      - name: Prepare Playwright for mobile and desktop browser smoke tests
        run: |
          npm install --prefix /tmp/among-gas-playwright --no-save playwright@1.56.1
          /tmp/among-gas-playwright/node_modules/.bin/playwright install chromium

      - name: Start Telegram Mini App and play a mobile UI smoke test
        env:
          PLAYWRIGHT_MODULE: /tmp/among-gas-playwright/node_modules/playwright/index.mjs
          VISUAL_QA_DIR: ${{ runner.temp }}/among-gas-visual-qa
          VECTOR_COLLISION_DOCUMENT_PATH: ${{ runner.temp }}/vector-collision-editor-test.json
          VECTOR_COLLISION_EDITOR_BASE_URL: http://127.0.0.1:5173
        run: |
          rm -f "${RUNNER_TEMP}/vector-collision-editor-test.json" "${RUNNER_TEMP}/vector-collision-editor-test.json.bak"
          nohup env VITE_ENABLE_GAME_MOCKS=true VECTOR_COLLISION_DOCUMENT_PATH="${VECTOR_COLLISION_DOCUMENT_PATH}" pnpm --filter @workspace/telegram-game run dev >/tmp/among-gas-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5173/?mock=task-interaction" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:5173/?mock=task-interaction" >/dev/null
          node scripts/browser-smoke.mjs
          pnpm --filter @workspace/scripts run test:map-tiles-browser
          node scripts/test-audio-preload.mjs
          node scripts/test-character-atlas-browser.mjs
          node scripts/test-ingame-settings.mjs
          node scripts/test-vector-collision-editor-browser.mjs
          pnpm --filter @workspace/scripts run test:vector-collision-editor-api

      - name: Render production-map collision overlay for visual QA
        run: pnpm --filter @workspace/scripts exec tsx src/renderCollisionQa.ts

      - name: Render fine-grid collision, shadow and vision QA
        if: always()
        run: pnpm --filter @workspace/scripts exec tsx renderCollisionQa.ts --candidate

      - name: Upload gameplay visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: among-gas-visual-qa
          path: |
            ${{ runner.temp }}/among-gas-visual-qa/*.png
            ${{ runner.temp }}/among-gas-visual-qa/hud-state-matrix.json
            ${{ runner.temp }}/among-gas-visual-qa/character-atlas-golden-matrix.png
            ${{ runner.temp }}/among-gas-visual-qa/character-atlas-gameplay-scale.png
            ${{ runner.temp }}/among-gas-visual-qa/character-atlas-frame-metrics.json
            artifacts/telegram-game/collision-qa-overlay.png
            artifacts/telegram-game/collision-reference-overlay.png
            attached_assets/IMG_2907_1783632830477.jpeg
            artifacts/telegram-game/collision-qa-overlay-webp.png
            artifacts/telegram-game/collision-shadow-qa-overlay.png
            artifacts/telegram-game/collision-vision-qa-overlay.png
            artifacts/telegram-game/collision-qa-tiles/*.png
            lib/shared/src/collisionData.generated-preview.ts
            lib/shared/src/collisionDataFine.generated-preview.ts
          if-no-files-found: warn
          retention-days: 3

      - name: Run three independently seeded 100-game balance batches
        run: |
          set -uo pipefail
          cohort_status=0
          for seed in 17001 17002 17003; do
            echo "::group::Seeded balance cohort $seed"
            if pnpm --filter @workspace/api-server run simulate -- --games 100 --bots 6 --concurrency 25 --timeoutMs 300000 --quiet --maxTimeouts 0 --minCrewWinRatePct 45 --maxCrewWinRatePct 65 --seed "$seed"; then
              echo "Cohort $seed passed the 45–65% crew-win band with zero timeouts."
            else
              echo "::error::Cohort $seed failed its balance or timeout gate."
              cohort_status=1
            fi
            echo "::endgroup::"
          done
          exit "$cohort_status"
