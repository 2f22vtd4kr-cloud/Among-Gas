name: Among Gas build and gameplay smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest main/PR verification in flight. Rapid fix commits should
# not leave the actual current tip waiting behind obsolete queued runs.
concurrency:
  group: among-gas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: 5173
      BASE_PATH: /
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify collision-map gameplay coordinates
        run: node scripts/verify-map-mechanics.mjs

      - name: Typecheck and build API/frontend
        run: pnpm run build

      - name: Run server gameplay invariants
        run: pnpm --filter @workspace/api-server run test:gameplay

      - name: Install Chromium for mobile browser smoke tests
        run: |
          npm install --prefix /tmp/among-gas-playwright --no-save playwright@1.56.1
          /tmp/among-gas-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Start Telegram Mini App and play a mobile UI smoke test
        env:
          PLAYWRIGHT_MODULE: /tmp/among-gas-playwright/node_modules/playwright/index.mjs
        run: |
          nohup pnpm --filter @workspace/telegram-game run dev >/tmp/among-gas-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5173/?mock=task-interaction" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:5173/?mock=task-interaction" >/dev/null
          node scripts/browser-smoke.mjs

      - name: Run headless multiplayer gameplay simulations
        run: pnpm --filter @workspace/api-server run simulate -- --games 100 --bots 6 --concurrency 25 --timeoutMs 120000 --quiet --maxTimeouts 0
